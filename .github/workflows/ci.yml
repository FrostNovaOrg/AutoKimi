name: AutoKimi checks

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      integration:
        description: Build the runtime and run native integration checks
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm test
      - run: npm run check
      - run: npm run prepare:upstream

  integration:
    if: github.event_name == 'workflow_dispatch' && inputs.integration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      KIMI_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: sudo apt-get update && sudo apt-get install --yes bubblewrap socat ripgrep
      - name: Enable sandbox namespaces on the disposable Linux runner
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sudo sysctl -w kernel.unprivileged_userns_clone=1
      - name: Verify Linux sandbox backend
        run: /usr/bin/bwrap --ro-bind / / --dev /dev --proc /proc --unshare-user --unshare-pid --unshare-net -- /usr/bin/true
      - run: npm install --global pnpm@10.33.0
      - run: npm run build
      - run: npm run test:headless
      - run: npm run test:upstream
      - run: npm run test:install
